<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de Média</h1>
        <p class=" subtitulo">Sistema de Notas de Aluno</p>

        

        <div id="formulario">
            <label>Nome do Aluno:</label>
            <input type="text" id="nome" required placeholder="Digite o nome do aluno" required>
            <label>Disciplina:</label>
                <select id="disciplina" required>
                <option value="">Selecione uma disciplina</option>
                <option value="FDD">Fundamentos do Design Digital</option>
                <option value="FTDI">Fotografia Digital</option>
                <option value="PRAAI">Projetos de Audio e Vídeo I</option>
            </select>

        </div>

        <br>
        
        <div class="notas">

            <div>
            <label>1º Bimestre</label>
            <input type="number" id="nota1" 
            placeholder="Digite a nota" required>
            </div>
            <div>
            <label>2º Bimestre</label>
            <input type="number" id="nota2" 
            placeholder="Digite a nota" required>
            </div>
           <div> 
            <label>3º Bimestre</label>
            <input type="number" id="nota3" 
            placeholder="Digite a nota" required>
            </div>
           <div>
            <label>4º Bimestre</label>
            <input type="number" id="nota4" 
            placeholder="Digite a nota" required>
            </div>
            




        </div> <!--Formulario-->

                <div>

            <button id="calcular" 
            onclick="calcularMedia()">
            Calcular Média</button>

            <button id="calcularnovo" 
            onclick="calcularNovo()">
            Calcular Novamente</button>

        <a href="" id="link">Calculadora Normal</a>
        
        <div id="resultado" class="resultado">

            <p>Preencha os dados acima e clique em calcular a média</p>

        </div>

        </div><!--Notas-->
    
    </div> <!--Container-->


<script src="../js/script.js"></script>
</body>
</html>
